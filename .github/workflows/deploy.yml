name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 連続 push 時にデプロイが競合・逆転しないようにする（main は進行中をキャンセルせず直列化）。
# PR は最新の push だけ検証できればよいので、進行中の実行をキャンセルする。
# ref 別グループにして、PR の verify が main のデプロイ待機枠を奪わないようにする
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 型検査・OG画像の存在・canonical一致（ビルド内）・内部リンクを検証する。
  # main への push だけでなく PR でも走らせ、壊れた変更をデプロイ前に止める。
  # ビルドはこのジョブの1回だけで、検証済みの dist をそのままプレビュー・本番に回す
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Astro 7 の要求は Node 22.12 以上（package.json の engines と揃える）
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check (astro check)
        run: npm run check
      - name: OG image existence check
        run: node scripts/check-og-images.mjs
      - name: Build (canonical check + sitemap generation を含む)
        run: npm run build
      - name: Internal link check
        run: node scripts/check-links.mjs
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          include-hidden-files: true
          retention-days: 7

  # PR の内容をプレビュー用の別 Worker（nextb-net-preview、workers.dev のみ・noindex）に配信する。
  # 本番には反映されない。プレビューは1つなので、最後に push された PR の内容が表示される。
  # フォークからの PR には Secrets が渡らないため、同じリポジトリのブランチからの PR に限る
  preview:
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Deploy preview
        run: npx wrangler deploy --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://nextb.net
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Deploy
        # 複数環境を定義しているため、本番（top-level）であることを明示する
        run: npx wrangler deploy --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
