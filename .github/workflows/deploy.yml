name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 既定は読み取りのみ。Pages への書き込み権限は deploy ジョブだけに与える
permissions:
  contents: read

# 連続 push 時にデプロイが競合・逆転しないようにする（main は進行中をキャンセルせず直列化）。
# PR は最新の push だけ検証できればよいので、進行中の実行をキャンセルする。
# ref 別グループにして、PR の verify が main のデプロイ待機枠を奪わないようにする
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 型検査・OG画像の存在・canonical一致（ビルド内）・内部リンクを検証する。
  # main への push だけでなく PR でも走らせ、壊れた変更をデプロイ前に止める。
  # ビルドはこのジョブの1回だけで、検証済みの dist をそのままデプロイに回す（PR では回さない）
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Astro 7 の要求は Node 22.12 以上（package.json の engines と揃える）
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check (astro check)
        run: npm run check
      - name: OG image existence check
        run: node scripts/check-og-images.mjs
      - name: Build (canonical check + sitemap generation を含む)
        run: npm run build
      - name: Internal link check
        run: node scripts/check-links.mjs
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
