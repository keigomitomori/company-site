name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 連続 push 時にデプロイが競合・逆転しないようにする（進行中はキャンセルせず直列化）。
# ref 別グループにして、PR の verify が main のデプロイ待機枠を奪わないようにする
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 型検査・OG画像の存在・canonical一致（ビルド内）・内部リンクを検証する。
  # main への push だけでなく PR でも走らせ、壊れた変更をデプロイ前に止める。
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check (astro check)
        run: npm run check
      - name: OG image existence check
        run: node scripts/check-og-images.mjs
      - name: Build (canonical check + sitemap generation を含む)
        run: npm run build
      - name: Internal link check
        run: node scripts/check-links.mjs

  build:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build with Astro
        uses: withastro/action@v6
        with:
          # verify ジョブと同じ Node で検証済み成果物と同条件のビルドにする
          node-version: 22

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
